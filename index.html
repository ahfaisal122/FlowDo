

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowDo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap');

  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --surface3: #272727;
    --border: #2a2a2a;
    --text: #e8e4df;
    --text-dim: #7a756e;
    --text-muted: #4a4640;
    --accent: #e8a44a;
    --accent-dim: rgba(232,164,74,0.12);
    --danger: #c45c5c;
    --danger-dim: rgba(196,92,92,0.12);
    --success: #5c9e6b;
    --success-dim: rgba(92,158,107,0.12);
    --priority-high: #c45c5c;
    --priority-medium: #e8a44a;
    --priority-low: #5c9e6b;
    --cat-work: #6b8fd4;
    --cat-personal: #b97fd4;
    --cat-shopping: #5cbcb0;
    --cat-health: #d47f7f;
    --radius: 10px;
    --radius-sm: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }

  /* ─── Scrollbar ────────────────────────────── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ─── Layout ───────────────────────────────── */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .drag-region {
    height: 48px;
    flex-shrink: 0;
    -webkit-app-region: drag;
  }

  .header {
    padding: 0 24px 16px;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }

  .header h1 {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 32px;
    font-weight: 400;
    letter-spacing: -0.5px;
    color: var(--text);
    font-style: italic;
  }

  .header h1 span { color: var(--accent); }

  .stats-row {
    display: flex;
    gap: 16px;
    margin-top: 10px;
  }

  .stat {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .stat strong {
    color: var(--text);
    font-weight: 600;
  }

  /* ─── Filter Bar ───────────────────────────── */
  .filter-bar {
    display: flex;
    gap: 6px;
    padding: 0 24px 12px;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
    overflow-x: auto;
  }

  .filter-btn {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-btn:hover { border-color: var(--text-muted); color: var(--text); }
  .filter-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ─── Task List ────────────────────────────── */
  .task-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 24px 120px;
    -webkit-app-region: no-drag;
  }

  .date-group-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    padding: 16px 0 8px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 2;
  }

  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 6px;
    cursor: default;
    transition: all 0.2s;
    animation: slideIn 0.25s ease-out;
    position: relative;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .task-item:hover {
    border-color: var(--text-muted);
    background: var(--surface2);
  }

  .task-item.completed { opacity: 0.45; }
  .task-item.completed .task-text { text-decoration: line-through; }

  /* checkbox */
  .task-check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    margin-top: 1px;
  }

  .task-check:hover { border-color: var(--accent); }
  .task-check.checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .task-check.checked::after {
    content: '✓';
    color: var(--bg);
    font-size: 12px;
    font-weight: 700;
  }

  .task-body { flex: 1; min-width: 0; }
  .task-text {
    font-size: 14px;
    font-weight: 400;
    line-height: 1.4;
    color: var(--text);
    word-break: break-word;
  }

  .task-meta {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .tag {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .tag-priority-high { background: var(--danger-dim); color: var(--priority-high); }
  .tag-priority-medium { background: var(--accent-dim); color: var(--priority-medium); }
  .tag-priority-low { background: var(--success-dim); color: var(--priority-low); }

  .tag-category {
    background: rgba(255,255,255,0.05);
    color: var(--text-dim);
  }
  .tag-category[data-cat="work"] { color: var(--cat-work); background: rgba(107,143,212,0.12); }
  .tag-category[data-cat="personal"] { color: var(--cat-personal); background: rgba(185,127,212,0.12); }
  .tag-category[data-cat="shopping"] { color: var(--cat-shopping); background: rgba(92,188,176,0.12); }
  .tag-category[data-cat="health"] { color: var(--cat-health); background: rgba(212,127,127,0.12); }

  .tag-due {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .tag-due.overdue { color: var(--danger); }
  .tag-due.today { color: var(--accent); }

  /* delete */
  .task-delete {
    opacity: 0;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .task-item:hover .task-delete { opacity: 1; }
  .task-delete:hover { color: var(--danger); }

  /* ─── Empty State ──────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  .empty-state p {
    font-size: 14px;
    line-height: 1.6;
  }

  /* ─── Add Task Panel ───────────────────────── */
  .add-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0));
    -webkit-app-region: no-drag;
    z-index: 10;
  }

  .add-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .add-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .add-input:focus { border-color: var(--accent); }
  .add-input::placeholder { color: var(--text-muted); }

  .add-btn {
    width: 40px;
    height: 40px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: var(--bg);
    font-size: 22px;
    font-weight: 300;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .add-btn:hover { filter: brightness(1.15); transform: scale(1.05); }
  .add-btn:active { transform: scale(0.97); }

  .options-row {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .option-select {
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color 0.2s;
  }

  .option-select:focus { border-color: var(--accent); }

  .date-input {
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
    color-scheme: dark;
  }

  .date-input:focus { border-color: var(--accent); }

  /* ─── Reminder Toast ───────────────────────── */
  .toast {
    position: fixed;
    top: 56px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--accent);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    z-index: 100;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="app">
  <div class="drag-region"></div>

  <div class="header">
    <h1>Flow<span>Do</span></h1>
    <div class="stats-row">
      <div class="stat"><strong id="statTotal">0</strong> tasks</div>
      <div class="stat"><strong id="statDone">0</strong> done</div>
      <div class="stat"><strong id="statOverdue">0</strong> overdue</div>
    </div>
  </div>

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="completed">Done</button>
    <button class="filter-btn" data-filter="high">🔴 High</button>
    <button class="filter-btn" data-filter="work" data-type="cat">Work</button>
    <button class="filter-btn" data-filter="personal" data-type="cat">Personal</button>
    <button class="filter-btn" data-filter="shopping" data-type="cat">Shopping</button>
    <button class="filter-btn" data-filter="health" data-type="cat">Health</button>
  </div>

  <div class="task-list" id="taskList"></div>

  <div class="add-panel">
    <div class="add-row">
      <input type="text" class="add-input" id="taskInput" placeholder="What needs to be done?" />
      <button class="add-btn" id="addBtn">+</button>
    </div>
    <div class="options-row">
      <select class="option-select" id="prioritySelect">
        <option value="low">Low priority</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High priority</option>
      </select>
      <select class="option-select" id="categorySelect">
        <option value="">No category</option>
        <option value="work">Work</option>
        <option value="personal">Personal</option>
        <option value="shopping">Shopping</option>
        <option value="health">Health</option>
      </select>
      <input type="date" class="date-input" id="dueDateInput" />
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const { ipcRenderer } = require('electron');

  let tasks = [];
  let activeFilter = 'all';

  // ─── Init ────────────────────────────────────
  async function init() {
    tasks = await ipcRenderer.invoke('load-tasks') || [];
    render();
    checkReminders();
    // Check reminders every 60 seconds
    setInterval(checkReminders, 60000);
  }

  // ─── Save ────────────────────────────────────
  async function save() {
    await ipcRenderer.invoke('save-tasks', tasks);
  }

  // ─── Add Task ────────────────────────────────
  function addTask() {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;

    const task = {
      id: Date.now().toString(),
      text,
      completed: false,
      priority: document.getElementById('prioritySelect').value,
      category: document.getElementById('categorySelect').value,
      dueDate: document.getElementById('dueDateInput').value || null,
      createdAt: new Date().toISOString(),
      reminded: false
    };

    tasks.unshift(task);
    input.value = '';
    document.getElementById('dueDateInput').value = '';
    save();
    render();
  }

  // ─── Toggle ──────────────────────────────────
  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      task.completed = !task.completed;
      save();
      render();
    }
  }

  // ─── Delete ──────────────────────────────────
  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  // ─── Date Helpers ────────────────────────────
  function formatDueDate(dateStr) {
    if (!dateStr) return null;
    const d = new Date(dateStr + 'T00:00:00');
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const diff = Math.floor((d - today) / 86400000);

    if (diff < 0) return { label: `${Math.abs(diff)}d overdue`, cls: 'overdue' };
    if (diff === 0) return { label: 'Today', cls: 'today' };
    if (diff === 1) return { label: 'Tomorrow', cls: '' };
    return { label: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), cls: '' };
  }

  // ─── Reminders ───────────────────────────────
  function checkReminders() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const todayStr = today.toISOString().split('T')[0];

    tasks.forEach(task => {
      if (!task.completed && task.dueDate && !task.reminded) {
        if (task.dueDate === todayStr || task.dueDate < todayStr) {
          task.reminded = true;
          showToast(`⏰ "${task.text}" is due ${task.dueDate === todayStr ? 'today' : 'overdue'}!`);
          ipcRenderer.invoke('show-notification', {
            title: 'FlowDo Reminder',
            body: `"${task.text}" is ${task.dueDate === todayStr ? 'due today' : 'overdue'}!`
          });
        }
      }
    });
    save();
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3500);
  }

  // ─── Filter ──────────────────────────────────
  function getFilteredTasks() {
    return tasks.filter(t => {
      switch (activeFilter) {
        case 'all': return true;
        case 'active': return !t.completed;
        case 'completed': return t.completed;
        case 'high': return t.priority === 'high' && !t.completed;
        default: return t.category === activeFilter;
      }
    });
  }

  // ─── Render ──────────────────────────────────
  function render() {
    const list = document.getElementById('taskList');
    const filtered = getFilteredTasks();

    // Stats
    const total = tasks.filter(t => !t.completed).length;
    const done = tasks.filter(t => t.completed).length;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const todayStr = today.toISOString().split('T')[0];
    const overdue = tasks.filter(t => !t.completed && t.dueDate && t.dueDate < todayStr).length;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statDone').textContent = done;
    document.getElementById('statOverdue').textContent = overdue;

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">✦</div>
          <p>No tasks here.<br/>Add one below to get started.</p>
        </div>`;
      return;
    }

    let html = '';
    filtered.forEach(task => {
      const due = formatDueDate(task.dueDate);
      html += `
        <div class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
          <div class="task-check ${task.completed ? 'checked' : ''}" onclick="toggleTask('${task.id}')"></div>
          <div class="task-body">
            <div class="task-text">${escapeHtml(task.text)}</div>
            <div class="task-meta">
              <span class="tag tag-priority-${task.priority}">${task.priority}</span>
              ${task.category ? `<span class="tag tag-category" data-cat="${task.category}">${task.category}</span>` : ''}
              ${due ? `<span class="tag-due ${due.cls}">📅 ${due.label}</span>` : ''}
            </div>
          </div>
          <button class="task-delete" onclick="deleteTask('${task.id}')">✕</button>
        </div>`;
    });

    list.innerHTML = html;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ─── Events ──────────────────────────────────
  document.getElementById('addBtn').addEventListener('click', addTask);
  document.getElementById('taskInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });

  document.getElementById('filterBar').addEventListener('click', (e) => {
    if (e.target.classList.contains('filter-btn')) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      activeFilter = e.target.dataset.filter;
      render();
    }
  });

  init();
</script>

</body>
</html>
